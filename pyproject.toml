[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "aiosqlite==0.20.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "httpx==0.28.0",
    "anthropic==0.40.0",
    "mcp==1.1.2",
    "strands-agents==0.1.5",
    "apscheduler==3.10.4",
    "typer==0.15.1",
    "pywebpush==2.0.0",
    "cryptography==44.0.0",
    "python-multipart==0.0.18",
    "pyyaml==6.0.2",
    "sse-starlette==2.1.3",
]

[project.scripts]
agentos = "agentos.cli.cli:app"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agentos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
