# AgentOS CI — install, typecheck, test, build on every push/PR.
#
# Reproduces the documented local flow (`pnpm install && pnpm build && pnpm test`):
#   - pnpm pinned via the `packageManager` field in package.json
#   - Node 22 LTS (matches the supported engines range, >= 20)
#   - `--frozen-lockfile` keeps the lockfile authoritative
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (blueprint §22 acceptance suite)
        run: pnpm test

      - name: Build (server + CLI + PWA web)
        run: pnpm build
