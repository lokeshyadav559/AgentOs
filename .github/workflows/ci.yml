# AgentOS CI/CD — staged pipeline:
#
#   verify      → install, typecheck, blueprint §22 acceptance suite (fast feedback)
#   build       → compile server + CLI + PWA web; upload the dist artifact
#   functional  → boot the BUILT artifact and drive the real HTTP/CLI surfaces
#                 (auth wall, task→session→inbox→reply→done, webhook HMAC,
#                 goal loop, YAML round trip) — blueprint §22 manual-demo script,
#                 automated via the simulated runner (no API keys required)
#   deploy      → on version tags (v*): package the build artifacts into a
#                 runnable release bundle and publish it as a GitHub Release
#                 (agentos-<version>.tar.gz + sha256)
#
# pnpm pinned via the `packageManager` field in package.json; Node 22 LTS.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck + acceptance tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Acceptance tests (blueprint §22)
        run: pnpm test

  build:
    name: Build (server + CLI + PWA web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentos-dist
          path: |
            dist
            apps/web/dist
          if-no-files-found: error

  functional:
    name: Functional (E2E against built artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: agentos-dist

      - name: Functional smoke (built server + CLI)
        run: pnpm test:functional

  deploy:
    name: Deploy (GitHub Release on tags)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: agentos-dist

      - name: Package release bundle
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="release/agentos-${VER}"
          mkdir -p "${STAGE}/dist" "${STAGE}/apps/web/dist"
          cp -r dist/. "${STAGE}/dist/"
          cp -r apps/web/dist/. "${STAGE}/apps/web/dist/"
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml "${STAGE}/"
          sed "s/__VERSION__/${VER}/" scripts/RUNNING.md > "${STAGE}/RUNNING.md"
          tar -czf "agentos-${VER}.tar.gz" -C release "agentos-${VER}"
          sha256sum "agentos-${VER}.tar.gz" > "agentos-${VER}.tar.gz.sha256"
          ls -lh "agentos-${VER}.tar.gz" "agentos-${VER}.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "agentos-${VER}.tar.gz" "agentos-${VER}.tar.gz.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AgentOS ${VER}" \
            --generate-notes

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs: [build, functional]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only publish on version tags; PRs and main pushes build (validate)
      # the image without pushing.
      - name: Login to GHCR
        uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentos:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/agentos:latest
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
