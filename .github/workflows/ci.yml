# AgentOS CI/CD — Python rewrite pipeline.
#
# Jobs:
#   verify-python   → pytest acceptance suite (no API keys needed)
#   verify-ts       → original TS typecheck + acceptance tests (kept for reference)
#   build-web       → compile React SPA
#   functional      → boot Python server + run HTTP smoke tests
#   deploy          → GitHub Release on version tags (v*)
#   docker-python   → build/push python Dockerfile.python image to GHCR
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python acceptance suite ──────────────────────────────────────────────
  verify-python:
    name: Verify Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir ".[dev]"

      - name: Run tests
        run: pytest -v

  # ── TS verify (kept for the original Node server) ────────────────────────
  verify-ts:
    name: Verify TS (typecheck + acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # ── Build React SPA ──────────────────────────────────────────────────────
  build-web:
    name: Build React SPA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [verify-python, verify-ts]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cd apps/web && pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  # ── Python functional smoke ───────────────────────────────────────────────
  functional:
    name: Functional smoke (Python server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Install dependencies
        run: pip install --no-cache-dir ".[dev]"

      - name: Start server in background and smoke-test
        run: |
          export AGENTOS_OPERATOR_TOKEN=smoke-token
          python -m agentos.api.server &
          SERVER_PID=$!
          sleep 3
          STATUS=$(curl -sf http://127.0.0.1:3000/api/health | python -c "import sys,json; d=json.load(sys.stdin); print(d['ok'])")
          kill $SERVER_PID
          [ "$STATUS" = "True" ] || (echo "health check failed" && exit 1)

  # ── GitHub Release ────────────────────────────────────────────────────────
  deploy:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    needs: [build-web, functional]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Package Python bundle
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="release/agentos-${VER}"
          mkdir -p "${STAGE}"
          cp -r agentos pyproject.toml scripts/RUNNING.md "${STAGE}/"
          cp -r apps/web/dist "${STAGE}/web-dist"
          tar -czf "agentos-${VER}.tar.gz" -C release "agentos-${VER}"
          sha256sum "agentos-${VER}.tar.gz" > "agentos-${VER}.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "agentos-${VER}.tar.gz" "agentos-${VER}.tar.gz.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AgentOS ${VER} (Python)" \
            --generate-notes

  # ── Docker Python image ───────────────────────────────────────────────────
  docker-python:
    name: Docker Python image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs: [build-web, functional]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentos-py
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long,prefix=edge-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.python
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
