# AgentOS CI — staged pipeline:
#
#   verify      → install, typecheck, blueprint §22 acceptance suite (fast feedback)
#   build       → compile server + CLI + PWA web; upload the dist artifact
#   functional  → boot the BUILT artifact and drive the real HTTP/CLI surfaces
#                 (auth wall, task→session→inbox→reply→done, webhook HMAC,
#                 goal loop, YAML round trip) — blueprint §22 manual-demo script,
#                 automated via the simulated runner (no API keys required)
#
# pnpm pinned via the `packageManager` field in package.json; Node 22 LTS.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (typecheck + acceptance tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Acceptance tests (blueprint §22)
        run: pnpm test

  build:
    name: Build (server + CLI + PWA web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentos-dist
          path: |
            dist
            apps/web/dist
          if-no-files-found: error

  functional:
    name: Functional (E2E against built artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: agentos-dist

      - name: Functional smoke (built server + CLI)
        run: pnpm test:functional
